services:
  db:
    image: postgres:16
    container_name: estoque-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estoque_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estoque_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: estoque-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-estoque_db}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no arquivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
