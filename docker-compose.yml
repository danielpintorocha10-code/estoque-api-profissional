services:
  db:
    image: postgres:16
    container_name: estoque-postgres
    environment:
      POSTGRES_DB: estoque_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: estoque-api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/estoque_db
      SECRET_KEY: troque-esta-chave-em-producao
    ports:
      - "8000:8000"

volumes:
  postgres_data:
